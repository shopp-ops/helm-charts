apiVersion: v2
name: shoppops-infra
description: >
  Cluster infrastructure for local development.
  Installs the CNPG PostgreSQL operator, NGINX ingress controller,
  and Shop operator CRDs.
type: application
version: 0.1.3
maintainers:
  - name: shopp-ops
    email: danilo.cvijetic10@gmail.com
dependencies:
  - name: cloudnative-pg
    version: "0.28.2"
    repository: "https://cloudnative-pg.github.io/charts"
  - name: ingress-nginx
    version: "4.15.0"
    repository: "https://kubernetes.github.io/ingress-nginx"
  - name: community-operator
    version: "0.13.0"
    repository: "https://mongodb.github.io/helm-charts"
  - name: shop-operator
    version: "0.1.0"
    repository: "oci://ghcr.io/shopp-ops/charts"
