apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shops.apps.shop-operator.io
  annotations:
    # Mock CRD — no controller running in local dev. The CRD allows ShopHub to
    # create/read/delete Shop resources via the K8s API without errors.
    shop-operator.io/mock: "true"
spec:
  group: apps.shop-operator.io
  names:
    kind: Shop
    listKind: ShopList
    plural: shops
    singular: shop
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, availability, walletAddress, database]
              properties:
                name:
                  type: string
                availability:
                  type: string
                  enum: [standard, high]
                walletAddress:
                  type: string
                database:
                  type: string
                  enum: [standard, light]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Availability
          type: string
          jsonPath: .spec.availability
        - name: Database
          type: string
          jsonPath: .spec.database
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
