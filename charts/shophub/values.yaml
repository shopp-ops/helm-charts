api:
  replicaCount: 1
  image:
    repository: ghcr.io/shopp-ops/shophub-api
    tag: latest
    pullPolicy: IfNotPresent
  jwtSecret: ""
  baseUrl: ""        # http://shophub.local/api — CORS_ORIGIN
  nodeEnv: "production"
  # Images the operator stamps onto every Shop CR (SHOP_API_IMAGE / SHOP_WEB_IMAGE).
  # Must be overridden per environment (ghcr tags in prod, dev tags + kind load locally).
  shopApiImage: ""
  shopWebImage: ""
  # Suffix for per-shop ingress hosts: shophub.<name>-<id>.<suffix>.
  # Locally, "127.0.0.1.sslip.io" makes every shop resolve to localhost with no /etc/hosts.
  shopHostSuffix: ""

web:
  replicaCount: 1
  image:
    repository: ghcr.io/shopp-ops/shophub-web
    tag: latest
    pullPolicy: IfNotPresent
  baseUrl: ""        # http://shophub.local
  nodeEnv: "production"

ingress:
  enabled: true
  className: nginx
  host: shophub.local

database:
  clusterName: shophub-db
  name: shophub
  username: shophub
  # Override in values.local.yaml — never commit passwords
  password: ""
  storage: 1Gi
  # Single instance is enough for local dev
  instances: 1

# ServiceAccount the API pod runs as — its token is the in-cluster
# identity used by @kubernetes/client-node to manage Shop resources.
serviceAccount:
  create: true
  # Defaults to <release>-api when empty
  name: ""

# Cluster-scoped RBAC granting the API permission to manage Shop CRs,
# their per-shop namespaces, and the secrets inside them.
rbac:
  create: true
