apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "shophub.clusterName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.database.instances }}
  storage:
    size: {{ .Values.database.storage }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.username }}
      secret:
        name: {{ include "shophub.credentialsSecret" . }}
