name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Publish changed charts
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p /tmp/charts
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            version=$(grep '^version:' "${chart_dir}Chart.yaml" | awk '{print $2}')

            if helm show chart "oci://ghcr.io/${OWNER}/${chart_name}:${version}" 2>/dev/null; then
              echo "Skipping ${chart_name}:${version} — already published"
              continue
            fi

            if [ -f "${chart_dir}Chart.yaml" ] && grep -q '^dependencies:' "${chart_dir}Chart.yaml"; then
              helm dependency update "$chart_dir"
            fi

            helm package "$chart_dir" --destination /tmp/charts
            helm push "/tmp/charts/${chart_name}-${version}.tgz" "oci://ghcr.io/${OWNER}"
            echo "Published ${chart_name}:${version}"
          done
